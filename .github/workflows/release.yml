name: Publish release artifact

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify release version and build
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(./gradlew -q printVersion)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ESCAPED_BASE_VERSION="${BASE_VERSION//./\\.}"

          if [[ "${TAG_VERSION}" == "${BASE_VERSION}" ]]; then
            RELEASE_VERSION="${BASE_VERSION}"
          elif [[ "${TAG_VERSION}" =~ ^${ESCAPED_BASE_VERSION}-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            RELEASE_VERSION="${TAG_VERSION}"
          else
            echo "Release tag ${GITHUB_REF_NAME} does not match project base version ${BASE_VERSION}." >&2
            exit 1
          fi

          if [[ "${RELEASE_VERSION}" != "${BASE_VERSION}" ]]; then
            python - "${BASE_VERSION}" "${RELEASE_VERSION}" <<'PY'
          from pathlib import Path
          import re
          import sys

          base_version, release_version = sys.argv[1:3]
          path = Path("build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          pattern = rf'(?m)^version\s*=\s*"{re.escape(base_version)}"\s*$'
          replacement = f'version = "{release_version}"'
          updated, count = re.subn(pattern, replacement, source, count=1)
          if count != 1:
              raise SystemExit(
                  f"Could not apply prerelease version {release_version} to build.gradle.kts."
              )
          path.write_text(updated, encoding="utf-8")
          PY
          fi

          EFFECTIVE_VERSION="$(./gradlew -q printVersion)"
          if [[ "${EFFECTIVE_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "Release version resolved to ${EFFECTIVE_VERSION}, expected ${RELEASE_VERSION}." >&2
            exit 1
          fi

          ./gradlew clean test build
          EXPECTED_JAR="build/libs/lastseen-discord-${RELEASE_VERSION}.jar"
          if [[ ! -f "${EXPECTED_JAR}" ]]; then
            echo "Expected plugin artifact ${EXPECTED_JAR} was not produced." >&2
            exit 1
          fi

          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print)
          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "Expected exactly one release JAR, found ${#JARS[@]}." >&2
            exit 1
          fi

          CHECKSUM="${EXPECTED_JAR}.sha256"
          (
            cd build/libs
            sha256sum "$(basename "${EXPECTED_JAR}")" > "$(basename "${CHECKSUM}")"
          )
          echo "jar=${EXPECTED_JAR}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"

      - name: Attach JAR and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "${{ steps.artifact.outputs.jar }}"
          "${{ steps.artifact.outputs.checksum }}"
          --clobber
