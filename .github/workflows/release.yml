name: Publish release artifact

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify release version and build
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q printVersion)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match project version ${VERSION}." >&2
            exit 1
          fi

          ./gradlew clean test build
          EXPECTED_JAR="build/libs/lastseen-discord-${VERSION}.jar"
          if [[ ! -f "${EXPECTED_JAR}" ]]; then
            echo "Expected plugin artifact ${EXPECTED_JAR} was not produced." >&2
            exit 1
          fi

          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print)
          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "Expected exactly one release JAR, found ${#JARS[@]}." >&2
            exit 1
          fi

          CHECKSUM="${EXPECTED_JAR}.sha256"
          (
            cd build/libs
            sha256sum "$(basename "${EXPECTED_JAR}")" > "$(basename "${CHECKSUM}")"
          )
          echo "jar=${EXPECTED_JAR}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"

      - name: Attach JAR and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "${{ steps.artifact.outputs.jar }}"
          "${{ steps.artifact.outputs.checksum }}"
          --clobber
